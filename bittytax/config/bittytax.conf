# BittyTax config file (bittytax.conf)
#

# Report date format
date_format: '%d/%m/%Y'

# Local currency
local_currency: 'GBP'

# Used to differentiate between fiat and cryptoasset transactions, include in here all fiat currencies which are used in your transaction records
fiat_list:
    ['GBP', 'EUR', 'USD']

# Identifies which cryptoasset take priority when calculating the value of a crypto-to-crypto trade
crypto_list:
    ['BTC', 'ETH', 'XRP', 'LTC', 'BCH', 'BNB', 'USDT']

# Method used to calculate the value of trades:
#   0 = buy value
#   1 = sell value
#   2 = priority value (recommended), use either buy or sell value according to priority order defined by (fiat_list + crypto_list)
trade_asset_type: 2

# Method used to attribute the allowable cost for crypto-to-crypto trades:
#   0 = buy asset
#   1 = sell asset
#   2 = split (default), allowable cost split evenly between buy and sell assets
trade_allowable_cost_type: 2

# Include empty wallets in current holdings report
show_empty_wallets: False

# Include transfer transactions (i.e. 'deposit', 'withdrawal') in tax calculations
transfers_include: False

# Transfer fees are a disposal
transfer_fee_disposal: True

# Transfer fees are an allowable cost
transfer_fee_allowable_cost: False

# Lost tokens result in a reacquisition
lost_buyback: True

# Which data source(s) to use to retrieve price data for a specific asset, otherwise defaults are used as defined below
data_source_select: {
    }

# Which data source(s) to use for fiat currency prices
data_source_fiat:
    ['BittyTaxAPI']

# Which data source(s) to use for cryptoasset prices
# CryptoCompare and CoinDesk are no longer usable: CryptoCompare's coinlist endpoint now requires
# an API key and CoinDesk's v1 API has been retired. YahooFinance is a fallback for dates outside
# CoinGecko's keyless 365 day history window.
data_source_crypto:
    ['CoinGecko', 'YahooFinance']

# CoinGecko "Demo" API key (optional, free from https://www.coingecko.com/en/api).
# Without a key the public API only returns the last 365 days of price history, so historic
# prices older than that will be valued at 0. Can also be set via the COINGECKO_API_KEY
# environment variable.
coingecko_api_key: ''

# Coinbase trades which have zero fees should be identified as gifts
coinbase_zero_fees_are_gifts: False

# Used to identify 'gift-received' and 'gift-sent' transactions in ChangeTip data files
#usernames:
#    ['<your username>']

# --- US tax rules (--taxrules US_INDIVIDUAL) ---

# Local time zone, used for tax year boundaries and holding periods. Timestamps without a
# zone in your records are still read as UTC.
us_timezone: 'America/Los_Angeles'

# us_timezone applies from this date (at midnight in us_timezone). Earlier transactions keep
# the time zone your filed returns used (us_timezone_before), so filed years don't change.
us_timezone_from: '2025-01-01'
us_timezone_before: 'Europe/London'

# Basis is identified wallet by wallet for transactions from this date (Treas. Reg.
# 1.1012-1(j)). Earlier gains use the universal method, and the lots held in each wallet at
# this date are found by tracing the earlier transactions wallet by wallet.
us_wallet_cutover: '2025-01-01'

# A Withdrawal is matched to a Deposit of the same asset into another wallet which arrives
# within this many hours, for the same quantity or less by up to this fraction. A
# transfer:<id> token in the Note of both records links them explicitly instead.
transfer_match_window_hours: 24
transfer_match_tolerance: 0.005

# Wallet details: whether a wallet is held by a broker (custody: broker) or yourself
# (custody: self), and whether it issues a Form 1099-DA, which gives a warning for any year
# its '1099-DA' sheet has no rows
wallets: {
    }
#    'Coinbase': {custody: broker, issues_1099da: True},
#    'Ledger': {custody: self},

# Name and SSN printed on the Form 8949 statement, left blank to fill in by hand
us_taxpayer_name: ''
us_taxpayer_ssn: ''

# Standing orders, specific identifications and Form 1099-DA rows are kept in your records
# workbook, alongside your transactions:
#   'Standing Orders'   Wallet ('*' for all), Method (FIFO/LIFO/HIFO/LOFO), Effective From
#   'Identifications'   Wallet, Timestamp, Asset, Quantity, Lot ID, Recorded At
#   '1099-DA <broker>'  Form Year, Wallet, Asset, Date Sold, Quantity, Proceeds, Cost Basis,
#                       Date Acquired, Term, Basis Reported
# Effective From and Recorded At are local time unless a zone is given, and must be when you
# actually made the record. Lot IDs are listed by --export-lots.
